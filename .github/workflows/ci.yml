name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: pytest tests -q
      # The GPU backend needs Metal, which CI runners do not expose; the NumPy
      # batched backend is what actually gets exercised here, and it is the
      # reference the GPU kernel is checked against locally.
      - name: Smoke-test the public API
        run: |
          python -c "
          import numpy as np, bandqr
          print(bandqr.__version__, 'threads:', bandqr.has_threads(),
                'backends:', bandqr.available_backends())
          n = 200
          A = (np.diag(np.full(n, 4.0)) + np.diag(np.ones(n-1), 1)
               + np.diag(np.ones(n-1), -1))
          b = np.ones(n)
          assert np.linalg.norm(A @ bandqr.solve(A, b) - b) < 1e-12
          "

  portability:
    name: serial build (no pthreads)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip && pip install numpy scipy pytest
      - name: Build without threading support
        run: |
          cc -O3 -funroll-loops -ffp-contract=fast -fPIC -Wall -Wextra -Werror \
             -DBANDQR_NO_THREADS -shared -o src/bandqr/libbandqr.so \
             src/bandqr/csrc/bandqr.c -lm
      - name: Test
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          import bandqr; assert not bandqr.has_threads()
          print('serial build OK')
          "
          PYTHONPATH=src pytest tests -q

  warnings:
    name: strict C build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with -Werror, threaded and serial, C11 pedantic
        run: |
          set -e
          for extra in "" "-DBANDQR_NO_THREADS"; do
            cc -std=c11 -pedantic -Wall -Wextra -Werror $extra \
               -c src/bandqr/csrc/bandqr.c -o /dev/null
          done
          echo "no warnings"

  standalone:
    name: single-file build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip && pip install numpy scipy
      - name: Regenerate and check it is current
        run: |
          python tools/make_standalone.py
          git diff --exit-code bandqr_standalone.py \
            || (echo "bandqr_standalone.py is stale: re-run tools/make_standalone.py"; exit 1)
      - name: Import and solve
        run: |
          cd /tmp && cp $GITHUB_WORKSPACE/bandqr_standalone.py .
          python -c "
          import numpy as np, bandqr_standalone as bq
          n = 300
          A = (np.diag(np.full(n, 6.0)) + np.diag(np.ones(n-1), 1)
               + np.diag(np.ones(n-1), -1))
          b = np.random.default_rng(0).standard_normal(n)
          for m in ('givens', 'householder', 'lq', 'lu'):
              x = bq.solve(A, b, method=m)
              assert np.linalg.norm(A @ x - b) / np.linalg.norm(b) < 1e-12, m
          print('standalone OK')
          "
