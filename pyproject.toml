[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bandqr"
version = "0.2.0"
description = "Fast, deterministic banded and almost-banded QR, with a batched GPU backend"
readme = "README.md"
requires-python = ">=3.9"
# No licence chosen yet -- until one is added the default is all rights
# reserved, so add a LICENSE file and restore
#     license = { file = "LICENSE" }
# before publishing to PyPI.
authors = [{ name = "Sid Holden" }]
keywords = ["linear-algebra", "qr", "banded", "spectral-methods", "gpu", "metal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
sparse = ["scipy>=1.7"]
gpu = ["mlx>=0.20"]
test = ["pytest>=7", "scipy>=1.7"]
bench = ["scipy>=1.7", "matplotlib>=3.5", "pandas>=1.3"]
all = ["scipy>=1.7", "mlx>=0.20", "pytest>=7", "matplotlib>=3.5", "pandas>=1.3"]

[project.urls]
Homepage = "https://github.com/sidneyholden/bandqr"
Issues = "https://github.com/sidneyholden/bandqr/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bandqr = ["csrc/*.c", "csrc/*.h", "*.dylib", "*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
markers = [
    "gpu: requires MLX and a Metal device",
    "slow: long-running benchmark-ish test",
]

[tool.ruff]
line-length = 90
